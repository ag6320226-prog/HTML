<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <title>BMW Motion Reveal</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        .canvas {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .outer-glow {
            position: absolute;
            width: 280px;
            height: 280px;
            border: 4px solid transparent;
            border-top: 4px solid #fff;
            border-left: 4px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            filter: blur(1px);
            box-shadow: 0 0 20px #fff;
        }
        .quadrants{
            animation: spin 2s linear infinite ;

        }

        .logo-box {
            position: relative;
            width: 250px;
            height: 250px;
            transform: scale(0); 
            animation: popIn 0.8s cubic-bezier(0.17, 0.67, 0.83, 0.67)
             forwards 0.5s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quadrants {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
            overflow: hidden;
            border: 2px solid #fff;
            position: absolute;
        }

        .blue {
            position: absolute;
            width: 50%;
            height: 50%;
            background-color: #0092ff;
        }
        .q1 { top: 0; right: 0; }
        .q2 { bottom: 0; left: 0; }

        .text-bmw {
            position: relative;
            color: #fff;
            font-size: 45px;
            z-index: 10;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255,255,255,0.7);
        }


        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            80% { transform: scale(1.1) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

    </style>
</head>
<body>

<div class="canvas">
    <div class="outer-glow"></div>
    
    <div class="logo-box">
        <div class="quadrants">
            <div class="blue q1"></div>
            <div class="blue q2"></div>
        </div>
        <div class="text-bmw">BMW</div>
    </div>
</div>

</body>
</html>
